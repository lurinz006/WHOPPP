<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Apex Summit Roofing | Premier Residential & Commercial Roofing & Restoration</title>
    <meta name="description" content="Certified Master Elite roofing contractors. Emergency leak repair, full roof replacements, and 21-point drone inspections. Flexible 0% APR financing via Whop." />
    
    <!-- Premium Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800;900&family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet" />

    <!-- Whop Pixel Guard & Fallback (Platform injects automatically on whop.site) -->
    <script>
      window.whop = window.whop || {
        track: function(eventName, payload) {
          console.log('[Whop Pixel Event Fired]:', eventName, payload);
          window.dispatchEvent(new CustomEvent('whop:pixel_event', {
            detail: { event: eventName, payload: payload, timestamp: new Date().toISOString() }
          }));
        }
      };
    </script>
  </head>
  <body class="bg-slate-950 text-slate-100 antialiased selection:bg-amber-500 selection:text-slate-950">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
